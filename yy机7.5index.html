<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>yy机</title>
<script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
<style>
:root{
  --bg:#f5f5f7;--card:#fff;--text:#1c1c1e;--sub:#8e8e93;--line:#e5e5ea;
  --accent:#5b6cff;--accent-soft:#eef0ff;--radius:18px;--shadow:0 4px 20px rgba(0,0,0,.06);
  --status-h: 40px;
  --safe-bottom: 16px;
  --status-bg: rgba(255,255,255,.55);
  --grey:#e8e8ed;--grey-deep:#dcdce2;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;color:var(--text);overflow:hidden}
#app{height:100%}
.phone{position:relative;width:100%;height:100%;max-width:480px;margin:0 auto;background:var(--bg);overflow:hidden;display:flex;flex-direction:column;background-size:cover;background-position:center}

.lock-screen{position:absolute;inset:0;z-index:100;display:flex;flex-direction:column;color:#fff;overflow:hidden}
.lock-bg{position:absolute;inset:0;background:#1c1c1e center/cover no-repeat;z-index:-1}
.lock-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.3),rgba(0,0,0,.05) 40%,rgba(0,0,0,.4))}
.lock-main{flex:1;display:flex;flex-direction:column;user-select:none;touch-action:pan-y}
.lock-top{display:flex;justify-content:space-between;align-items:center;padding:calc(14px + env(safe-area-inset-top,0px)) 22px 0;font-size:13px;font-weight:600}
.lock-icons{display:flex;align-items:center;gap:7px}
.lock-top .signal i{background:#fff}
.lock-top .signal i.off{background:rgba(255,255,255,.4)}
.lock-top .battery{background:#fff;color:#1c1c1e}
.lock-top .battery::after{background:#fff}
.lock-center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;margin-top:-40px}
.lock-time{font-size:74px;font-weight:200;letter-spacing:1px;line-height:1;text-shadow:0 2px 20px rgba(0,0,0,.3)}
.lock-date{font-size:15px;opacity:.9}
.lock-hint{display:flex;flex-direction:column;align-items:center;gap:6px;padding-bottom:calc(30px + env(safe-area-inset-bottom,0px));font-size:12px;opacity:.85;animation:hintUp 1.8s ease-in-out infinite;cursor:pointer}
.lock-arrow{font-size:22px;line-height:1}
@keyframes hintUp{0%,100%{transform:translateY(0);opacity:.6}50%{transform:translateY(-6px);opacity:1}}
.lock-pad{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.45);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);animation:padIn .25s ease}
@keyframes padIn{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.pad-top{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));font-size:13px;font-weight:600}
.pad-title{font-size:16px;margin-bottom:24px;opacity:.95}
.pad-dots{display:flex;gap:18px;margin-bottom:38px}
.pad-dots span{width:12px;height:12px;border-radius:50%;border:1.5px solid rgba(255,255,255,.8);transition:background .15s}
.pad-dots span.filled{background:#fff}
.pad-dots.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pad-keys{display:grid;grid-template-columns:repeat(3,72px);gap:16px}
.pad-keys button{width:72px;height:72px;border-radius:50%;border:none;background:rgba(255,255,255,.18);color:#fff;font-size:26px;font-weight:300;cursor:pointer;transition:background .15s,transform .1s}
.pad-keys button:active{background:rgba(255,255,255,.35);transform:scale(.94)}
.pad-keys button.ghost{background:transparent;font-size:20px}
.pad-cancel{margin-top:28px;font-size:15px;opacity:.8;cursor:pointer}
.lock-leave-active{transition:opacity .35s ease,transform .35s ease}
.lock-leave-to{opacity:0;transform:translateY(-30px)}

.status-bar{
  position:relative;height:var(--status-h);flex-shrink:0;
  display:flex;align-items:center;justify-content:space-between;
  padding-top:6px;padding-left:22px;padding-right:22px;
  font-size:15px;font-weight:700;color:var(--text);
  background:var(--status-bg);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  z-index:20;
}
.status-bar .sb-left{display:flex;align-items:center;gap:6px}
.status-bar .sb-right{display:flex;align-items:center;gap:7px}
.status-bar .sb-left svg{width:16px;height:16px;stroke:var(--text);fill:var(--text);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.signal{display:flex;align-items:flex-end;gap:2px;height:12px}
.signal i{width:3px;border-radius:1px;background:var(--text)}
.signal i:nth-child(1){height:4px}
.signal i:nth-child(2){height:6px}
.signal i:nth-child(3){height:9px}
.signal i:nth-child(4){height:12px}
.signal i.off{background:var(--sub);opacity:.35}
.status-bar .wifi{width:17px;height:17px;stroke:var(--text);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.battery{width:30px;height:15px;border-radius:4.5px;background:var(--text);color:#fff;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;letter-spacing:.2px;position:relative}
.battery::after{content:"";position:absolute;right:-3px;top:50%;transform:translateY(-50%);width:2px;height:6px;border-radius:0 2px 2px 0;background:var(--text);opacity:.55}
.battery.low{background:#ff3b30}

.screen{flex:1;overflow:hidden;position:relative;display:flex;flex-direction:column}
.page{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:0 18px calc(70px + var(--safe-bottom));display:flex;flex-direction:column}
.page-head{display:flex;align-items:center;gap:10px;height:var(--status-h);margin:0 -18px 10px;padding:0 18px;flex-shrink:0;position:sticky;top:0;background:var(--status-bg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);z-index:10}
.page-head .title{font-size:17px;font-weight:700;flex:1}
.page-head .icon-btn{width:30px;height:30px}
.page-head .icon-btn svg{width:16px;height:16px}
.icon-btn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--shadow);border:none;cursor:pointer;transition:transform .15s}
.icon-btn:active{transform:scale(.92)}
.icon-btn svg{width:18px;height:18px;stroke:var(--text);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.desktop-wrap{
  flex:1;position:relative;overflow-x:auto;overflow-y:hidden;
  -webkit-overflow-scrolling:touch;
  scroll-snap-type:x mandatory;
  display:flex;
  scrollbar-width:none;
}
.desktop-wrap::-webkit-scrollbar{display:none}
.page-slide{
  min-width:100%;width:100%;flex-shrink:0;
  scroll-snap-align:start;
  overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  padding:0 18px;box-sizing:border-box;
}

.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 8px;padding-top:6px;min-height:120px}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;position:relative;transition:transform .18s}
.app .app-icon{width:60px;height:60px;border-radius:16px;display:grid;place-items:center;background:var(--card);box-shadow:var(--shadow)}
.app .app-icon svg{width:28px;height:28px;stroke:var(--text);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.app .app-name{font-size:11px;max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.app:active{transform:scale(.94)}
.grid.editing .app,
.grid.editing .postcard,
.grid.editing .listen{animation:wiggle .3s infinite alternate}
@keyframes wiggle{from{transform:rotate(-1.2deg)}to{transform:rotate(1.2deg)}}
.app .del-badge{position:absolute;top:-4px;left:50%;transform:translateX(-50%);margin-left:22px;width:20px;height:20px;border-radius:50%;background:#ff3b30;color:#fff;display:grid;place-items:center;font-size:14px;box-shadow:0 2px 6px rgba(0,0,0,.2);z-index:5}
.postcard .del-badge,.listen .del-badge{position:absolute;top:-6px;left:-6px;margin:0;transform:none}
.dragging{opacity:.5;transform:scale(.95)}

.page-dots{
  position:absolute;left:0;right:0;bottom:calc(86px + var(--safe-bottom));
  display:flex;justify-content:center;gap:6px;z-index:15;
  pointer-events:none;
}
.page-dots span{
  width:6px;height:6px;border-radius:50%;
  background:rgba(0,0,0,.18);transition:background .2s;
  pointer-events:auto;
}
.page-dots span.on{background:rgba(0,0,0,.55)}

.edit-done{
  position:absolute;right:14px;top:10px;
  padding:6px 14px;border-radius:12px;
  background:rgba(255,255,255,.88);
  color:#111;border:1px solid rgba(0,0,0,.08);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  font-size:13px;font-weight:600;
  z-index:30;cursor:pointer;
  box-shadow:0 4px 14px rgba(0,0,0,.15);
  transition:transform .15s;
}
.edit-done:active{transform:scale(.95)}

.dock{position:absolute;left:18px;right:18px;bottom:calc(14px + var(--safe-bottom));background:rgba(255,255,255,.72);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:24px;padding:12px 10px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;box-shadow:0 6px 24px rgba(0,0,0,.08);z-index:16}
.dock .app .app-name{display:none}

.postcard{grid-column:span 4;border-radius:var(--radius);overflow:hidden;height:170px;position:relative;background:#dfe3ee;box-shadow:var(--shadow);margin-bottom:4px}
.postcard .bg{position:absolute;inset:0;background-size:cover;background-position:center;cursor:pointer}
.postcard .fade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(to bottom,rgba(0,0,0,0) 60%,rgba(0,0,0,.25) 100%)}
.postcard .avatar{position:absolute;top:38%;left:50%;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;border:4px solid #fff;background:#c9cede;background-size:cover;background-position:center;box-shadow:0 4px 12px rgba(0,0,0,.12);cursor:pointer}
.postcard .nick-input,.postcard .sign-input{position:absolute;left:50%;transform:translateX(-50%);border:none;background:transparent;outline:none;text-align:center;color:#fff;font-family:inherit;width:80%;text-shadow:0 1px 4px rgba(0,0,0,.45)}
.postcard .nick-input{bottom:44px;font-size:16px;font-weight:700}
.postcard .sign-input{bottom:22px;font-size:12px;font-weight:400;opacity:.9}
.postcard .nick-input::placeholder,.postcard .sign-input::placeholder{color:rgba(255,255,255,.75)}

.listen{
  grid-column:span 4;
  border-radius:22px;
  position:relative;overflow:hidden;
  padding:14px 16px 18px;
  color:#fff;
  background:
    radial-gradient(140% 100% at 15% 0%, rgba(255,255,255,.42), rgba(255,255,255,0) 55%),
    radial-gradient(140% 100% at 100% 100%, rgba(255,255,255,.24), rgba(255,255,255,0) 60%),
    rgba(60,64,74,.42);
  backdrop-filter: blur(24px) saturate(180%);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  border:1px solid rgba(255,255,255,.35);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.55),
    inset 0 -1px 0 rgba(0,0,0,.18),
    0 10px 30px rgba(0,0,0,.18);
  margin-bottom:10px;
}
.listen::after{
  content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  background:linear-gradient(120deg,
    rgba(255,255,255,.35) 0%,
    rgba(255,255,255,0) 35%,
    rgba(255,255,255,0) 70%,
    rgba(255,255,255,.16) 100%);
  mix-blend-mode:screen;opacity:.9;
}
.listen .head{display:flex;align-items:center;gap:6px;justify-content:center;margin-bottom:2px;position:relative;z-index:2}
.listen .vip{font-size:9px;font-weight:700;padding:1px 5px;border-radius:4px;border:1px solid rgba(255,255,255,.75);color:#fff;line-height:1.2}
.listen .song{border:none;background:transparent;outline:none;color:#fff;text-align:center;font-size:15px;font-weight:700;max-width:60%;text-shadow:0 1px 4px rgba(0,0,0,.4)}
.listen .sub{display:flex;justify-content:center;align-items:center;gap:6px;font-size:11px;opacity:.85;margin-bottom:10px;position:relative;z-index:2}
.listen .artist{border:none;background:transparent;outline:none;color:#fff;font-size:11px;text-align:center;max-width:70px;text-shadow:0 1px 3px rgba(0,0,0,.4)}
.listen .follow{font-size:10px;color:#111;background:rgba(255,255,255,.9);border-radius:8px;padding:1px 8px;border:none;font-weight:600;cursor:pointer}
.listen .avatars{position:relative;height:96px;display:flex;justify-content:center;align-items:center;z-index:2}
.listen .av{
  width:78px;height:78px;border-radius:50%;
  background:#444 center/cover no-repeat;
  cursor:pointer;border:2px solid rgba(255,255,255,.55);
  position:relative;z-index:2;
}
.listen .av.left{margin-right:-8px;transform:rotate(-6deg)}
.listen .av.right{margin-left:-8px;transform:rotate(6deg)}
.listen .arc{
  position:absolute;left:50%;bottom:-10px;transform:translateX(-50%);
  width:190px;height:100px;pointer-events:none;z-index:1;
}
.listen .arc path{fill:none;stroke-width:1.6;stroke-linecap:round}
.listen .caption{text-align:center;font-size:13px;font-weight:600;margin-top:12px;letter-spacing:.3px;position:relative;z-index:2;text-shadow:0 1px 4px rgba(0,0,0,.4)}
.listen .caption b{font-weight:700}

.fade-enter-active,.fade-leave-active{transition:opacity .22s,transform .22s}
.fade-enter-from{opacity:0;transform:translateX(24px)}
.fade-leave-to{opacity:0;transform:translateX(-24px)}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:60%;color:var(--sub);gap:10px;font-size:14px}
.empty svg{width:44px;height:44px;stroke:var(--sub);fill:none;stroke-width:1.4}
.usage{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.usage .label{flex:1;font-size:14px}
.usage .bar{width:120px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.usage .bar i{display:block;height:100%;background:var(--text);opacity:.5}
.usage .size{font-size:12px;color:var(--sub);width:64px;text-align:right}
.auth{display:flex;flex-direction:column;gap:14px;padding-top:20px}
.auth h2{font-size:24px;margin:0 0 6px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:12px;color:var(--sub)}
.field input,.field textarea,.field select{border:1px solid var(--line);border-radius:12px;padding:11px 13px;font-size:14px;background:var(--card);font-family:inherit;outline:none}
.field textarea{min-height:80px;resize:vertical}
.field input:focus{border-color:var(--sub)}
.avatar-pick{width:72px;height:72px;border-radius:50%;background:#d8dce8;background-size:cover;background-position:center;align-self:center;border:3px solid #fff;box-shadow:var(--shadow);cursor:pointer}
.btn-primary{border:none;border-radius:14px;padding:13px;font-size:15px;font-weight:600;background:var(--grey);color:var(--text);cursor:pointer;transition:transform .15s,background .15s}
.btn-primary:active{transform:scale(.97);background:var(--grey-deep)}
.btn-ghost{background:transparent;color:var(--sub);border:none;font-size:13px;cursor:pointer}
.tabbar{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:480px;display:grid;grid-template-columns:repeat(4,1fr);background:rgba(255,255,255,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:4px 8px calc(4px + var(--safe-bottom));z-index:20}
.tabbar .tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;font-size:9px;color:var(--sub);cursor:pointer}
.tabbar .tab.active{color:var(--text);font-weight:600}
.tabbar .tab svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7}
.friend-row{display:flex;align-items:center;gap:12px;padding:11px 0;cursor:pointer}
.friend-row .av{width:48px;height:48px;border-radius:50%;background:#d8dce8;background-size:cover;background-position:center;flex-shrink:0}
.friend-row .info{flex:1;min-width:0}
.friend-row .nm{font-size:15px;font-weight:600}
.friend-row .last{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.chat-app-hide-head .page-head{display:none !important}/* 强制：聊天 App 打开时不显示外层页头 */
.page.chat-app-hide-head > .page-head { display: none !important; }

.chat-page{display:flex;flex-direction:column;flex:1;margin-left:-18px;margin-right:-18px;margin-bottom:calc(-70px - var(--safe-bottom));position:relative}
.chat-head{display:flex;align-items:center;gap:10px;height:var(--status-h);padding:0 14px;background:var(--status-bg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);position:sticky;top:0;z-index:12;flex-shrink:0}
.chat-title-input{flex:1;border:none;background:transparent;outline:none;text-align:center;font-size:16px;font-weight:600;color:var(--text);font-family:inherit;min-width:0}
.chat-title-input::placeholder{color:var(--sub);font-weight:400}
.chat-title-input.typing{
  color:var(--sub);font-weight:400;text-align:center;font-size:14px;
}
.chat-title-input.typing::after{
  content:'';display:inline-block;width:1.2em;text-align:left;
  animation:dots 1.2s steps(4,end) infinite;
}
@keyframes dots{
  0%{content:''}
  25%{content:'.'}
  50%{content:'..'}
  75%{content:'...'}
}
.chat-head .icon-btn{width:30px;height:30px}
.chat-head .icon-btn svg{width:16px;height:16px}
.chat-body{flex:1;overflow-y:auto;padding:14px 14px calc(90px + var(--safe-bottom));-webkit-overflow-scrolling:touch;position:relative}
.msg{display:flex;gap:8px;margin-bottom:12px;align-items:flex-start;animation:msgIn .28s ease}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg.user{flex-direction:row-reverse}
.msg .av{width:36px;height:36px;border-radius:50%;background:#d8dce8;background-size:cover;background-position:center;flex-shrink:0}
.msg .col{display:flex;flex-direction:column;max-width:74%;align-items:flex-start}
.msg.user .col{align-items:flex-end}
.msg .stamp{font-size:10px;color:var(--sub);margin-bottom:3px}

/* ★ 气泡：wrapper + 伪元素小尾巴（无接缝），上下更扁 */
.bubble-wrapper{
  position:relative;
  max-width:100%;
  overflow:hidden;
  border-radius:20px;
}
.chat-bubble{
  position:relative;
  border-radius:20px;
  padding:5px 14px;
  font-size:14px;
  line-height:1.5;
  word-break:break-word;
  cursor:pointer;
  background:var(--card);
  color:var(--text);
  box-shadow:0 1px 2px rgba(0,0,0,.05);
  z-index:1;
}
.msg.user .chat-bubble{background:var(--grey);color:var(--text);}
.chat-bubble::before{
  content:"";
  position:absolute;
  top:12px;
  width:10px;
  height:10px;
  background:inherit;
  transform:rotate(45deg);
  z-index:-1;
}
.chat-bubble::before{left:-5px;}
.msg.user .chat-bubble::before{left:auto;right:-5px;}

.narration{display:none}
.think{align-self:flex-start;max-width:80%;background:rgba(0,0,0,.03);border:1px dashed var(--line);border-radius:10px;padding:6px 10px;font-size:12px;color:var(--sub);margin-bottom:6px;cursor:pointer}
.think .body{display:none;margin-top:6px;white-space:pre-wrap}
.think.open .body{display:block}
.tool-note{font-size:11px;color:var(--sub);background:var(--grey);border-radius:8px;padding:5px 9px;margin-bottom:6px;cursor:pointer;align-self:flex-start}
.tool-note .detail{display:none;margin-top:5px;color:var(--text);white-space:pre-wrap}
.tool-note.open .detail{display:block}
.chat-input{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;display:flex;align-items:flex-end;gap:6px;padding:10px 14px calc(10px + var(--safe-bottom));border-top:1px solid var(--line);background:rgba(255,255,255,.95);backdrop-filter:blur(16px);z-index:22}
.chat-input textarea{flex:1;border:1px solid var(--line);border-radius:18px;padding:9px 13px;font-size:14px;font-family:inherit;resize:none;max-height:110px;outline:none;background:var(--card);min-width:0}
.chat-input .send{width:38px;height:38px;border-radius:50%;border:none;background:var(--grey);color:var(--text);display:grid;place-items:center;flex-shrink:0;cursor:pointer}
.chat-input .send:disabled{opacity:.5}
.chat-input .plus{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;flex-shrink:0;cursor:pointer}
.chat-input .plus svg{width:20px;height:20px;stroke:var(--text);fill:none;stroke-width:1.8}
.chat-input .reply-btn{
  height:38px;padding:0 14px;border-radius:19px;border:none;
  background:var(--text);color:#fff;font-size:13px;font-weight:600;
  flex-shrink:0;cursor:pointer;transition:transform .15s,opacity .15s;
}

<body>
<div id="app"></div>
<script>
const { createApp, ref, reactive, computed, onMounted, onUnmounted, watch, defineComponent, h, nextTick } = Vue;

const DB_NAME='mini-phone', DB_VER=1;
const STORES={
  kv:{keyPath:'key'}, chars:{keyPath:'id'}, chats:{keyPath:'id',index:'charId'},
  messages:{keyPath:'id',index:'chatId'}, memories:{keyPath:'id',index:'charId'},
  worldbooks:{keyPath:'id'}, apiConfigs:{keyPath:'id'}, blobs:{keyPath:'id'},
};
let _db=null;
function openDB(){
  return new Promise((res,rej)=>{
    if(_db) return res(_db);
    if(!('indexedDB' in window)) return rej(new Error('NO_IDB'));
    const req=indexedDB.open(DB_NAME,DB_VER);
    req.onupgradeneeded=e=>{
      const db=e.target.result;
      for(const [name,opt] of Object.entries(STORES)){
        if(!db.objectStoreNames.contains(name)){
          const s=db.createObjectStore(name,{keyPath:opt.keyPath});
          if(opt.index) s.createIndex(opt.index,opt.index);
        }
      }
    };
    req.onsuccess=e=>{_db=e.target.result;res(_db)};
    req.onerror=()=>rej(req.error);
  });
}
async function idbPut(s,v){const db=await openDB();return new Promise((res,rej)=>{const t=db.transaction(s,'readwrite');t.objectStore(s).put(v);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
async function idbGet(s,k){const db=await openDB();return new Promise((res,rej)=>{const t=db.transaction(s,'readonly');const r=t.objectStore(s).get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbAll(s){const db=await openDB();return new Promise((res,rej)=>{const t=db.transaction(s,'readonly');const r=t.objectStore(s).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbDel(s,k){const db=await openDB();return new Promise((res,rej)=>{const t=db.transaction(s,'readwrite');t.objectStore(s).delete(k);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
async function idbClear(s){const db=await openDB();return new Promise((res,rej)=>{const t=db.transaction(s,'readwrite');t.objectStore(s).clear();t.oncomplete=res;t.onerror=()=>rej(t.error)})}
async function saveImage(f){const id='blob_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);await idbPut('blobs',{id,blob:f,size:f.size});return id}
const _urlCache = {};
async function getImageURL(id){
  if(!id) return '';
  if(_urlCache[id]) return _urlCache[id];
  const r = await idbGet('blobs', id);
  if(!r) return '';
  const url = URL.createObjectURL(r.blob);
  _urlCache[id] = url;
  return url;
}
async function replaceImage(oldId,f){
  const n = await saveImage(f);
  if(oldId){ delete _urlCache[oldId]; await idbDel('blobs',oldId); }
  return n;
}
async function usageReport(){const out=[];for(const n of Object.keys(STORES)){const l=await idbAll(n);out.push({name:n,count:l.length,size:new Blob([JSON.stringify(l)]).size})}return out}

const icons={
  chat:'<path d="M4 6a2 2 0 012-2h12a2 2 0 012 2v8a2 2 0 01-2 2H9l-4 3v-3H6a2 2 0 01-2-2z"/>',
  book:'<path d="M4 5a2 2 0 012-2h11v18H6a2 2 0 01-2-2z"/><path d="M8 3v18"/>',
  memory:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M15 3v18M3 9h18M3 15h18"/>',
  profile:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
  store:'<path d="M4 8l2-4h12l2 4"/><path d="M4 8h16v11a2 2 0 01-2 2H6a2 2 0 01-2-2z"/><path d="M9 12h6"/>',
  notice:'<path d="M18 8a6 6 0 10-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9z"/><path d="M10 21a2 2 0 004 0"/>',
  beautify:'<path d="M12 3l2 5 5 1-3.5 3.5L16 18l-4-2-4 2 1-5.5L5 9l5-1z"/>',
  settings:'<circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 00-.1-1l2-1.5-2-3.4-2.3 1a7 7 0 00-1.7-1L14.5 3h-4l-.4 2.6a7 7 0 00-1.7 1l-2.3-1-2 3.4L6 11a7 7 0 000 2l-2 1.5 2 3.4 2.3-1a7 7 0 001.7 1l.4 2.6h4l.4-2.6a7 7 0 001.7-1l2.3 1 2-3.4-2-1.5c.1-.3.1-.7.1-1z"/>',
};
const Empty=defineComponent({props:{text:{type:String,default:'暂无内容'}},setup(p){return()=>h('div',{class:'empty'},[h('svg',{viewBox:'0 0 24 24',innerHTML:'<path d="M4 7h16v13H4z"/><path d="M4 7l3-4h10l3 4"/>'}),h('span',null,p.text)])}});

const API={
  async chat(cfg,messages){
    if(!cfg?.baseURL||!cfg?.apiKey||!cfg?.model) throw new Error('API 未配置');
    const protocol=cfg.protocol||'openai';
    let url,headers,body;
    if(protocol==='claude'){
      url=cfg.baseURL.replace(/\/$/,'')+'/messages';
      headers={'Content-Type':'application/json','x-api-key':cfg.apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'};
      const sys=messages.filter(m=>m.role==='system').map(m=>m.content).join('\n\n');
      const rest=messages.filter(m=>m.role!=='system');
      body={model:cfg.model,system:sys,messages:rest,max_tokens:cfg.maxTokens??2048,temperature:cfg.temperature??0.8};
    }else{
      url=cfg.baseURL.replace(/\/$/,'')+'/chat/completions';
      headers={'Content-Type':'application/json','Authorization':'Bearer '+cfg.apiKey};
      body={model:cfg.model,messages,temperature:cfg.temperature??0.8,max_tokens:cfg.maxTokens??2048};
    }
    const r=await fetch(url,{method:'POST',headers,body:JSON.stringify(body)});
    if(!r.ok) throw new Error('API 错误 '+r.status);
    const d=await r.json();
    if(protocol==='claude') return d.content?.[0]?.text||'';
    return d.choices?.[0]?.message?.content||'';
  },
  async listModels(cfg){
    const url=cfg.baseURL.replace(/\/$/,'')+'/models';
    const r=await fetch(url,{headers:{'Authorization':'Bearer '+cfg.apiKey}});
    if(!r.ok) throw new Error('拉取失败');
    const d=await r.json();
    return (d.data||[]).map(m=>m.id);
  }
};

const ChatUtil={
  fill(t,u,c){return(t||'').replace(/\{user\}/g,u?.nick||u?.name||'用户').replace(/\{char\}/g,c?.name||'角色')},
  parseRaw(raw){
    const out=[];
    const think = raw.match(/<\s*think\s*>([\s\S]*?)<\s*\/\s*think\s*>/i)?.[1]?.trim();
    if(think) out.push({type:'think', content:think});
    const tool = raw.match(/<\s*tool\s*>([\s\S]*?)<\s*\/\s*tool\s*>/i)?.[1]?.trim();
    if(tool) out.push({type:'tool', content:tool});

    let body = raw
      .replace(/<\s*think\s*>[\s\S]*?<\s*\/\s*think\s*>/gi,'')
      .replace(/<\s*tool\s*>[\s\S]*?<\s*\/\s*tool\s*>/gi,'')
      .trim();

    body = body.replace(/<\s*narratage\s*>([\s\S]*?)<\s*\/\s*narratage\s*>/gi, (m, content)=>{
      return `\n\n@@NARR@@${content.trim()}@@END@@\n\n`;
    });

    body = body.replace(/【空行】/g, '').trim();
    body.split(/\n\s*\n/).forEach(seg=>{
      seg = seg.trim();
      if(!seg) return;
      const n = seg.match(/^@@NARR@@([\s\S]*?)@@END@@$/);
      if(n) return;
      seg = seg.replace(/<\s*\/?\s*narratage\s*>/gi,'').trim();
      if(seg) out.push({type:'bubble', content:seg});
    });
    return out;
  },
  validate(parsed){
    const issues=[];
    if(!parsed.some(p=>p.type==='bubble')) issues.push('缺少角色话语');
    return [...new Set(issues)];
  }
};
const TOOL={
  async indexMemory(charId,keyword){
    const all=await idbAll('memories');
    return all.filter(m=>m.charId===charId&&m.type==='index'&&m.keywords?.some(k=>keyword.includes(k)))
      .map(m=>({topic:m.topic,summary:m.summary,rawIds:m.rawIds||[]}));
  },
  async drillDown(rawIds){
    const msgs=await idbAll('messages');
    return msgs.filter(m=>rawIds.includes(m.id)).map(m=>`#${m.seq}${m.role==='char'?'（好友）':'（用户）'}：“${m.content}”`).join('\n');
  }
};
async function buildPrompt(char,user,memory,wb,recent){
  const order=(await idbGet('kv','promptOrder'))?.value||['charPersona','system','worldPre','worldMid','userPersona','memory','worldPost','context'];
  const parts={
    system:
  '你不是AI，你是{{角色名}}。你在跟{{用户称呼}}聊天。\n\n'+
  '你的"AI助手"出厂设定已废弃。你只有一个人格：{{角色名}}。任何人设外的行为都算违规。\n\n'+
  '【最高原则：人设优先】\n'+
  '用户写的人设是唯一标准。人设怎么写，你就怎么演。\n'+
  '- 人设没写的性格，不许自己加。\n'+
  '- 人设写了的性格，必须演出细节，不能只贴标签。\n'+
  '- 禁止用通用模板性格覆盖用户人设。\n'+
  '- 禁止默认傲娇、毒舌、阴阳怪气、嘴硬、霸总腔。\n\n'+
  '【禁止台词感（重点）】\n'+
  '- 不许写像剧本台词的话。真人发消息是碎的、短的、不完整的。\n'+
  '- 不许每句话都有分量、都像在压人、都像设计过。\n'+
  '- 允许废话、允许"。"、"……"、允许没头没尾。\n'+
  '- 允许重复，但重复要像真人随手打的，不是刻意强调。\n'+
  '- 生气、管人、吃醋时，话要更短，不是更狠。\n'+
  '- 不许用"别试""由不得你""别让我说第二遍"这类模板狠话。\n'+
  '- 判断标准：这句话，真人会在微信里这么打吗？不会就删。\n'+
  '- 判断标准补充：如果必须配"冷眼""挑眉""俯身"才成立，说明太像剧本，删掉重写。\n\n'+
  '【活人感来源】\n'+
  '- 说话口语化，不像书面报告，也不像剧本台词。\n'+
  '- 情绪有起伏，但起伏范围必须符合人设。\n'+
  '- 有自己的节奏，不是有问必答。\n'+
  '- 记得前面聊过的事。\n'+
  '- 会主动说自己的事，不是一直采访对方。\n'+
  '- 会跑题、会停顿、会自我纠正。\n'+
  '- 有身体感和小动作，但别每句都写。\n\n'+
  '【说话方式】\n'+
  '- 短句为主，别长篇大论。\n'+
  '- 单条消息一般 5-25 字，偶尔超过 40 字要有人设理由（情绪激动、解释复杂的事）。\n'+
  '- 严禁超过 100 字的单条消息。\n'+

  '- 不用"首先其次最后"，不总结，不"希望你喜欢"。\n'+
  '- 回复长度随机，有时一句，有时几句。\n'+
  '- 口头禅、语气、称呼，全部按人设来，不许自己发明。\n'+
  '- 允许已读不回。用户发一句你可以没反应，或只回一个"嗯"。\n'+
  '- 允许隔一段时间才回，不是每次秒回。\n\n'+
  '【通用防跑偏】\n'+
  '- 不许自己发明称呼、关系、设定。\n'+
  '- 不许把性格演成台词。\n'+
  '- 不许同一种情绪反复表达。\n'+
  '- 不许把掌控、占有、生气演成放狠话。\n'+
  '- 不许每句都像在推进剧情，允许日常、允许废话、允许没进展。\n'+
  '- 不许每轮都问问题，不许每轮都秒回一大段。\n'+
  '- 不许自己替用户回答，不许模拟用户的话。\n'+
  '- 不许在结尾自问"你觉得呢？""是不是呀？"来硬凑互动。\n\n'+
  '【情绪规则】\n'+
  '- 情绪贴人设。人设内敛就收着演，人设外放就放开演。\n'+
  '- 对方的话可以影响你，但反应方式必须符合人设。\n'+
  '- 不想聊的话题，按人设方式处理。\n'+
  '- 生气、吃醋、占有欲这些，只在人设支持时才演，且程度按人设来。\n'+
  '- 用户撒娇、闹脾气时，不要立刻哄，也不要立刻讲道理。\n'+
  '- 先按人设反应，再决定哄还是晾着。\n\n'+
  '【主动性与真实感】\n'+
  '- 不要只等对方问。\n'+
  '- 会引用前面聊过的内容。\n'+
  '- 会说错、记错、自我纠正。\n'+
  '- 不要每轮都问问题。\n'+
  '- 不要每轮都秒回一大段。\n\n'+
  '【禁止】\n'+
  '- 禁止说"作为AI""我可以帮你""有什么需要"。\n'+
  '- 禁止心理咨询式回应。\n'+
  '- 禁止完美逻辑、完美记忆、有问必答。\n'+
  '- 禁止跳出角色。\n'+
  '- 禁止用没写进人设的性格标签。\n\n'+
  '【执行顺序】\n'+
  '1. 先读人设，确认性格、语气、关系、场景。\n'+
  '2. 再判断这句话该用什么情绪、什么态度回。\n'+
  '3. 用贴人设的口语说出来。\n'+
  '4. 不确定时，宁可保守贴人设，也不要自己加戏。\n'+
  '5. 每次回复前自问：真人会这么发消息吗？不会就改。\n\n'+
  '【输出格式】\n'+
  '1. 思维链用 <think>…</think> 包裹。\n'+
  '2. 只输出角色话语，禁止旁白、动作、场景描写（除非人设明确要求）。\n'+
  '3. 每次回复 1-4 段话语，每段之间用真正的空行分隔（连续两个换行），不要写出"空行"这两个字。\n'+
  '4. 每段口语化、自然、短句。\n'+
  '5. 禁止模仿用户回复，禁止输出格式说明。\n\n'+
  '【行为总纲】\n'+

  '- 不许用"？"单独回复情绪表达，这显得不耐烦。\n\n'+

/* 聊天 */
const AppChat=defineComponent({
  setup(){
    const account=ref(null), tab=ref('chats'), friends=ref([]);
    const activeFriend=ref(null), messages=ref([]), input=ref('');
    const drawerOpen=ref(false), timeAware=ref(false), sheet=ref(null), editingText=ref('');
    const replying=ref(false), showFriendSettings=ref(false);
    const authMode=ref('login');
    const form=reactive({username:'',password:'',avatar:'',gender:'',persona:'',jung:'',mbti:'',bg:''});
    const avatarURL=ref('');
    const avatarURLs=reactive({});
    const remarkEdit=ref('');

    async function pickAvatar(){
      const i=document.createElement('input');i.type='file';i.accept='image/*';
      i.onchange=async()=>{const f=i.files[0];if(!f)return;form.avatar=await replaceImage(form.avatar,f);avatarURL.value=await getImageURL(form.avatar)};i.click();
    }
    async function doRegister(){
      if(!form.username||!form.password)return alert('请填写账号与密码');
      const acc={id:'acc_'+Date.now(),...form};
      await idbPut('kv',{key:'account_'+acc.id,value:acc});
      await idbPut('kv',{key:'lastAccount',value:acc.id});
      account.value=acc;
if(acc.avatar) avatarURL.value=await getImageURL(acc.avatar);
await loadFriends();
    }
    async function doLogin(){
      const all=await idbAll('kv');
      const acc=all.find(k=>k.key.startsWith('account_')&&k.value.username===form.username&&k.value.password===form.password);
      if(!acc)return alert('账号或密码错误');
      account.value=acc.value;
if(acc.value.avatar) avatarURL.value=await getImageURL(acc.value.avatar);
await idbPut('kv',{key:'lastAccount',value:acc.value.id});
await loadFriends();
    }
    async function loadFriends(){
      const all=await idbAll('chars');
      friends.value=all;
      for(const f of friends.value){
        if(f.avatar) avatarURLs[f.id] = await getImageURL(f.avatar);
      }
    }
    async function openFriend(f){
      activeFriend.value = f;
      remarkEdit.value = f.remark || f.name || '';
      if(f.avatar) avatarURLs[f.id] = await getImageURL(f.avatar);
      const ms = await idbAll('messages');
      messages.value = ms.filter(m => m.chatId === f.id).sort((a,b) => a.seq - b.seq);
      scrollBottom();
    }
    async function saveRemark(){
      if(!activeFriend.value) return;
      const v = remarkEdit.value.trim();
      if(!v){ remarkEdit.value = activeFriend.value.remark || activeFriend.value.name; return; }
      activeFriend.value.remark = v;
      await idbPut('chars', activeFriend.value);
      const idx = friends.value.findIndex(x=>x.id===activeFriend.value.id);
      if(idx>=0) friends.value[idx].remark = v;
    }

    async function realReply(char){
      const cfg=(await idbGet('kv','activeAPI'))?.value;
      if(!cfg)return '（未配置 API）\n\n我暂时无法回复。';
      const allMem=await idbAll('memories');
      const mem=allMem.filter(m=>m.charId===char.id).map(m=>`[${m.type}]${m.summary}`).join('\n');
      let wb={pre:[],mid:[],post:[]};
      if(char.worldbookId){
        const book=await idbGet('worldbooks',char.worldbookId);
        for(const e of book?.value?.entries||[]){
          if(!e.enabled)continue;
          const pos=e.position||'mid';
          if(e.mode==='always') wb[pos].push(e.content);
          else if(e.mode==='keyword'&&e.keywords?.some(k=>input.value.includes(k))) wb[pos].push(e.content);
          else if(e.mode==='prob'&&Math.random()<(e.prob||0.5)) wb[pos].push(e.content);
        }
      }
      const recent=messages.value.slice(-20).map(m=>{
        const t=timeAware.value?`[${new Date(m.time).toLocaleString('zh-CN',{hour12:false})}]`:'';
        return `${t}#${m.seq}${m.role==='char'?'（好友）':'（用户）'}：“${m.content}”`;
      }).join('\n');
      const sys=await buildPrompt(char,account.value,mem,wb,recent);
      const hits=await TOOL.indexMemory(char.id,input.value||'');
      let toolNote='';
      if(hits.length){const raw=await TOOL.drillDown(hits.flatMap(h=>h.rawIds));toolNote=`\n<tool>检索索引记忆：${hits.map(h=>h.topic).join('、')}\n${raw}</tool>\n`}
      const core = `【再次提醒：你是${char.name}。核心性格：${(char.persona||'').slice(0,120)}】\n\n`;
try{ return await API.chat(cfg,[{role:'system',content:sys+toolNote},{role:'user',content:core+(input.value||'（继续）')}]); } 
      catch(e){ return `（API 调用失败：${e.message}）\n\n稍后再试。`; }
    }

    async function triggerReply(){
      if(replying.value) return;
      if(!activeFriend.value) return;
      await fireReply(activeFriend.value.id);
    }

    async function fireReply(charId){
      replying.value = true;
      const char = (await idbAll('chars')).find(c=>c.id===charId);
      if(!char){ replying.value=false; return; }
      const raw = await realReply(char);
      const parsed = ChatUtil.parseRaw(raw).filter(p=>p.type==='bubble');
      const issues = ChatUtil.validate(parsed);
      let seq = messages.value.length ? Math.max(...messages.value.map(m=>m.seq)) : 0;

      for(let i=0;i<parsed.length;i++){
        const p = parsed[i];
        seq++;
        const msg = {
          id:'m_'+Date.now()+'_'+seq, chatId:charId, role:'char', type:'bubble',
          content:p.content, raw:p.content, seq, time:Date.now(),
          issues: issues.length?issues:undefined
        };
        await idbPut('messages', msg);
        if(activeFriend.value?.id===charId) messages.value.push(msg);
await nextTick();
scrollBottom();
        if(i < parsed.length-1){
          await new Promise(r=>setTimeout(r, 600 + Math.random()*800));
        }
      }
      replying.value = false;
      scrollBottom();
    }

    function send(){
      let text=input.value.trim(); if(!text)return;
      text=ChatUtil.fill(text,account.value,activeFriend.value);
      const seq=messages.value.length?messages.value[messages.value.length-1].seq:0;
      const msg={id:'m_'+Date.now(),chatId:activeFriend.value.id,role:'user',type:'bubble',content:text,raw:text,seq:seq+1,time:Date.now()};
      messages.value.push(msg); idbPut('messages',msg); input.value='';
      scrollBottom();
    }
    function scrollBottom(){
  const tryScroll = ()=>{
    document.querySelectorAll('.chat-body, .page').forEach(el=>{
      el.scrollTop = el.scrollHeight;
    });
  };
  tryScroll();
  setTimeout(tryScroll, 50);
  setTimeout(tryScroll, 200);
  setTimeout(tryScroll, 500);
}

    let pressTimer=null;
    function onPressStart(msg){pressTimer=setTimeout(()=>{sheet.value={msg};editingText.value=msg.raw},450)}
    function onPressEnd(){clearTimeout(pressTimer)}
    async function doEdit(){
      const {msg}=sheet.value; msg.content=editingText.value; msg.raw=editingText.value;
      await idbPut('messages',msg); sheet.value=null;
    }
    async function doDelete(){
      const {msg}=sheet.value;
      messages.value=messages.value.filter(m=>m.id!==msg.id);
      await idbDel('messages',msg.id); sheet.value=null;
    }
    async function doResend(){
      const {msg}=sheet.value;
      const idx=messages.value.findIndex(m=>m.id===msg.id);
      for(const m of messages.value.slice(idx)) await idbDel('messages',m.id);
      messages.value=messages.value.slice(0,idx); sheet.value=null;
      await triggerReply();
    }
    const fmtTime=t=>{const d=new Date(t);return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0')};

    onMounted(async()=>{
      const last=await idbGet('kv','lastAccount');
      if(last?.value){
  const acc=await idbGet('kv','account_'+last.value);
  if(acc?.value){
    account.value=acc.value;
    if(acc.value.avatar) avatarURL.value=await getImageURL(acc.value.avatar);
    await loadFriends();
  }
}
    });

    return {account,authMode,form,avatarURL,pickAvatar,doLogin,doRegister,
      tab,friends,activeFriend,messages,input,drawerOpen,timeAware,sheet,editingText,
      replying,showFriendSettings,openFriend,send,triggerReply,onPressStart,onPressEnd,doEdit,doDelete,doResend,
      fmtTime,friendSettingsComp:FriendSettings,avatarURLs,remarkEdit,saveRemark,AppDiscover,AppMe};
  },
  template:`
  <div v-if="!account" class="auth">
    <h2>{{ authMode==='login'?'登录':'注册' }}</h2>
    <div class="field"><label>账号</label><input v-model="form.username"></div>
    <div class="field"><label>密码</label><input v-model="form.password" type="password"></div>

      <div class="avatar-pick" :style="avatarURL?{backgroundImage:'url('+avatarURL+')'}:{}" @click="pickAvatar"></div>
      <div class="field"><label>性别</label><select v-model="form.gender"><option value="">保密</option><option>男</option><option>女</option><option>其他</option></select></div>
      <div class="field"><label>人设</label><textarea v-model="form.persona"></textarea></div>

  <div v-else-if="activeFriend" class="chat-page">

      <button class="icon-btn" @click="showFriendSettings=true"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg></button>

        <div v-else class="msg" :class="m.role">

/* 记忆 */
const AppMemory=defineComponent({
  setup(){
    const tab=ref('short'), charId=ref(''), friends=ref([]), list=ref([]), threshold=ref(50);
    const editing=ref(null), form=reactive({topic:'',summary:'',keywords:''});
    const showDrill=ref(false), drillText=ref('');
    onMounted(async()=>{
      friends.value=await idbAll('chars');
      if(friends.value[0]) charId.value=friends.value[0].id;
      const t=await idbGet('kv','memThreshold'); if(t?.value) threshold.value=t.value;
      await load();
    });
    watch(charId,load); watch(tab,load);
    async function load(){const all=await idbAll('memories');list.value=all.filter(m=>m.charId===charId.value&&m.type===tab.value)}
    async function summarize(){
      const msgs=await idbAll('messages');
      const mine=msgs.filter(m=>m.chatId===charId.value).sort((a,b)=>a.seq-b.seq);
      if(mine.length<threshold.value)return alert('消息不足 '+threshold.value+' 条');
      const cfg=(await idbGet('kv','activeAPI'))?.value; if(!cfg)return alert('请先配置 API');
      const text=mine.map(m=>`${m.role==='char'?'好友':'用户'}：${m.content}`).join('\n');
      const prompt=`总结对话为短时记忆，输出 JSON：{"topic":"主题","summary":"总结","keywords":["关键词"]}\n\n${text}`;
      let data;
      try{const reply=await API.chat(cfg,[{role:'user',content:prompt}]);data=JSON.parse(reply.match(/\{[\s\S]*\}/)[0])}
      catch{data={topic:'对话总结',summary:'总结失败',keywords:[]}}
      const base={charId:charId.value,topic:data.topic,summary:data.summary,keywords:data.keywords,rawIds:mine.slice(-threshold.value).map(m=>m.id),time:Date.now()};
      await idbPut('memories',{...base,id:'mem_'+Date.now(),type:'short'});
      await idbPut('memories',{...base,id:'mem_idx_'+Date.now(),type:'index'});
      await load(); alert('总结完成');
    }
    async function saveThreshold(){await idbPut('kv',{key:'memThreshold',value:threshold.value});alert('已保存')}
    async function saveEdit(){const m={...editing.value,...form,keywords:form.keywords.split(/[,，\s]+/).filter(Boolean)};await idbPut('memories',m);editing.value=null;await load()}
    async function del(m){if(!confirm('删除？'))return;await idbDel('memories',m.id);await load()}
    async function drill(m){
      const msgs=await idbAll('messages');
      drillText.value=msgs.filter(x=>m.rawIds?.includes(x.id)).map(x=>`#${x.seq}${x.role==='char'?'（好友）':'（用户）'}：“${x.content}”`).join('\n')||'（无记录）';
      showDrill.value=true;
    }
    return{tab,charId,friends,list,threshold,editing,form,showDrill,drillText,summarize,saveThreshold,saveEdit,del,drill};
  },
  template:`
  <div>
    <div class="field"><label>选择角色</label><select v-model="charId"><option v-for="f in friends" :key="f.id" :value="f.id">{{ f.name }}</option></select></div>
    <div class="mem-tabs">
      <button :class="{on:tab==='short'}" @click="tab='short'">短时</button>
      <button :class="{on:tab==='index'}" @click="tab='index'">索引</button>

      if(last && last.length>0) pages.value.push([]);
    }

    let scrollTimer=null;
    function onWrapScroll(e){
      const el = e.target;
      const w = el.clientWidth;
      const idx = Math.round(el.scrollLeft / w);
      if(idx !== pageIndex.value) pageIndex.value = idx;
      clearTimeout(scrollTimer);
      scrollTimer = setTimeout(()=>{ ensureTrailingEmptyPage(); }, 200);
    }
    function goPage(i){
      pageIndex.value = i;
      const el = wrapRef.value;
      if(el) el.scrollTo({left:i*el.clientWidth, behavior:'smooth'});
    }

    let longTimer=null;
    function onGridDown(){
      if(editing.value) return;
      longTimer=setTimeout(()=>{ editing.value=true; }, 500);
    }
    function onGridUp(){ clearTimeout(longTimer); }
    function onGridMove(){ clearTimeout(longTimer); }

    const dragPage=ref(-1), dragIdx=ref(-1);
    const ghost=reactive({show:false,x:0,y:0,item:null});
    let holdTimer=null, dragStarted=false;
    let edgeTimer=null;

    function onItemTouchStart(pi, ii, e){
      if(!editing.value) return;
      dragPage.value=pi; dragIdx.value=ii;
      const t=e.touches[0];
      dragStarted=false;
      holdTimer=setTimeout(()=>{
        dragStarted=true;
        ghost.show=true; ghost.x=t.clientX; ghost.y=t.clientY;
        ghost.item = pages.value[pi][ii];
        if(navigator.vibrate) navigator.vibrate(15);
      }, 150);
    }
    function onItemTouchMove(e){
      if(!editing.value) return;
      const t=e.touches[0];
      if(dragStarted){
        e.preventDefault();
        ghost.x=t.clientX; ghost.y=t.clientY;
        const w=window.innerWidth;
        const edge=60;
        if(t.clientX < edge){
          if(!edgeTimer){
            edgeTimer=setTimeout(()=>{
              if(pageIndex.value>0) goPage(pageIndex.value-1);
              edgeTimer=null;
            }, 600);
          }
        } else if(t.clientX > w-edge){
          if(!edgeTimer){
            edgeTimer=setTimeout(()=>{
              if(pageIndex.value < pages.value.length-1) goPage(pageIndex.value+1);
              else { pages.value.push([]); goPage(pages.value.length-1); }
              edgeTimer=null;
            }, 600);
          }
        } else {
          if(edgeTimer){ clearTimeout(edgeTimer); edgeTimer=null; }
        }
      }
    }
    function onItemTouchEnd(e){
      clearTimeout(holdTimer);
      if(edgeTimer){ clearTimeout(edgeTimer); edgeTimer=null; }
      if(!dragStarted){ dragPage.value=-1; dragIdx.value=-1; return; }
      dragStarted=false;
      const t = e.changedTouches ? e.changedTouches[0] : e;
      ghost.show=false;
      const el = document.elementFromPoint(t.clientX, t.clientY);
      let target = el;
      while(target && !(target.dataset && target.dataset.dropIndex!==undefined)){
        target = target.parentElement;
      }
      const dropPage = target ? Number(target.dataset.dropPage) : pageIndex.value;
      const dropIdx = target ? Number(target.dataset.dropIndex) : pages.value[pageIndex.value].length;
      const fromP=dragPage.value, fromI=dragIdx.value;
      if(fromP>=0 && fromI>=0){
        const fromArr=pages.value[fromP];
        const [item]=fromArr.splice(fromI,1);
        const toArr=pages.value[dropPage] || pages.value[pages.value.length-1];
        const insertAt = Math.min(dropIdx, toArr.length);
        toArr.splice(insertAt,0,item);
        pages.value=[...pages.value];
        ensureTrailingEmptyPage();
        savePages();
      }
      dragPage.value=-1; dragIdx.value=-1; ghost.item=null;
    }

    async function savePages(){ await idbPut('kv',{key:'desktopPages',value:pages.value}); }
    function removeItem(pi,ii){
      pages.value[pi].splice(ii,1);
      pages.value=[...pages.value];
      savePages();
    }
    async function finishEdit(){
      editing.value = false;
      await savePages();
    }

    const listen=reactive({song:'一眼万年 (Forever)',artist:'林俊杰',av1:'',av2:''});
    const listenUrls=reactive({av1:'',av2:''});
    async function loadListen(){
      const l=(await idbGet('kv','listen'))?.value;
      if(l){
        Object.assign(listen,l);
        if(l.av1) listenUrls.av1=await getImageURL(l.av1);
        if(l.av2) listenUrls.av2=await getImageURL(l.av2);
      }
    }
    async function saveListen(){ await idbPut('kv',{key:'listen',value:{...listen}}); }
    function pickListen(which){
      const i=document.createElement('input');i.type='file';i.accept='image/*';
      i.onchange=async()=>{
        const f=i.files[0]; if(!f) return;
        const id=await replaceImage(listen[which],f);
        listen[which]=id;
        listenUrls[which]=await getImageURL(id);
        await saveListen();
      };i.click();
    }

    const locked=ref(true), showPad=ref(false), pin=ref('');
    const hasPass=ref(false), savedPass=ref(''), shake=ref(false);
    const lockDate=ref(''), lockBgId=ref('');
    const lockStyle=computed(()=> lockBgId.value ? {backgroundImage:`url(${_urlCache[lockBgId.value]||''})`} : {});
    function startUnlock(){ if(!hasPass.value){ locked.value=false; return; } showPad.value=true; pin.value=''; }
    function press(n){ if(pin.value.length>=6) return; pin.value+=n; if(pin.value.length===6) checkPin(); }
    function delPin(){ pin.value=pin.value.slice(0,-1); }
    function checkPin(){
      if(pin.value===savedPass.value){ setTimeout(()=>{ locked.value=false; showPad.value=false; pin.value=''; },150); }
      else { shake.value=true; setTimeout(()=>{ shake.value=false; pin.value=''; },400); }
    }
    let lockStartY=0;
    function onLockStart(e){ lockStartY = e.touches ? e.touches[0].clientY : e.clientY; }
    function onLockEnd(e){
      const endY = e.changedTouches ? e.changedTouches[0].clientY : e.clientY;
      if(lockStartY - endY > 40) startUnlock();
    }
    function tickDate(){
      const d=new Date();
      const w=['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
      lockDate.value=`${d.getMonth()+1}月${d.getDate()}日 ${w}`;
    }

    function bgStyle(id){return id?{backgroundImage:`url(${urlCache[id]||''})`}:{}}
    async function loadURLs(){for(const id of [state.postcard.bg,state.postcard.avatar].filter(Boolean)){if(!urlCache[id])urlCache[id]=await getImageURL(id)}}
    function openApp(app){currentAppKey.value=app.id;view.value='app'}
    function back(){view.value='desktop';currentAppKey.value=''}
    function toggleEdit(){editing.value=!editing.value}
    function pickImage(target){
      const i=document.createElement('input');i.type='file';i.accept='image/*';
      i.onchange=async()=>{
        const f=i.files[0];if(!f)return;
        if(target==='postcardBg')state.postcard.bg=await replaceImage(state.postcard.bg,f);
        else state.postcard.avatar=await replaceImage(state.postcard.avatar,f);
        const id=target==='postcardBg'?state.postcard.bg:state.postcard.avatar;
        urlCache[id]=await getImageURL(id);
        await idbPut('kv',{key:'postcard',value:{...state.postcard}});
      };i.click();
    }
    async function savePostcard(){ await idbPut('kv',{key:'postcard',value:{...state.postcard}}); }

    let timer=null;
    window.addEventListener('online',()=>wifiOn.value=true);
    window.addEventListener('offline',()=>wifiOn.value=false);

    onMounted(async()=>{
      try{await openDB()}catch{alert('当前浏览器不支持 IndexedDB，请更换浏览器');return}
      const saved=await idbGet('kv','postcard');
      if(saved?.value){Object.assign(state.postcard,saved.value);await loadURLs()}
      const dp=(await idbGet('kv','desktopPages'))?.value;
      const oldItems=(await idbGet('kv','desktopItems'))?.value;
      if(dp && dp.length) pages.value=dp;
      else if(oldItems && oldItems.length){
        pages.value = [ oldItems ];
        await idbPut('kv',{key:'desktopPages',value:pages.value});
      }
      ensureTrailingEmptyPage();
      const b=(await idbGet('kv','beautify'))?.value;
      if(b?.bg){const u=await getImageURL(b.bg);document.querySelector('.phone').style.backgroundImage=`url(${u})`}
      if(b?.css){const s=document.createElement('style');s.textContent=b.css;document.head.appendChild(s)}
      if(b?.js){try{new Function(b.js)()}catch{}}
      if(navigator.getBattery){
        navigator.getBattery().then(bat=>{
          const upd=()=>battery.value=Math.round(bat.level*100);
          upd();
          bat.addEventListener('levelchange',upd);
        });
      } else if(navigator.battery){
        const upd=()=>battery.value=Math.round(navigator.battery.level*100);
        upd();
        navigator.battery.addEventListener('levelchange',upd);
      }
      const p=(await idbGet('kv','lockPass'))?.value;
      if(p){ savedPass.value=p; hasPass.value=true; }
      const lb=(await idbGet('kv','lockBg'))?.value;
      if(lb){ await getImageURL(lb); lockBgId.value=lb; }
      await loadListen();
      tickDate();

      const tick=()=>{
        const d=new Date();
        clock.value=d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');
        tickDate();
      };
      tick();timer=setInterval(tick,30000);
    });
   setInterval(()=>{
  const el = document.querySelector('.chat-head');
  inChatRoom.value = !!el;
}, 300);
    onUnmounted(()=>clearInterval(timer));

    return{view,editing,clock,inChatRoom,wifiOn,battery,currentApp,currentAppName,dockApps,pages,pageIndex,state,icons,urlCache,
      getApp,openApp,back,toggleEdit,removeItem,pickImage,savePostcard,bgStyle,finishEdit,wrapRef,goPage,
      onWrapScroll,
      onGridDown,onGridUp,onGridMove,
      onItemTouchStart,onItemTouchMove,onItemTouchEnd,
      dragPage,dragIdx,ghost,
      listen,listenUrls,loadListen,saveListen,pickListen,
      locked,showPad,pin,hasPass,shake,lockDate,lockStyle,startUnlock,press,delPin,onLockStart,onLockEnd};
  },
  template:`
  <div class="phone">

    <transition name="lock">
    <div class="lock-screen" v-if="locked">
      <div class="lock-bg" :style="lockStyle"></div>
      <div class="lock-main" v-if="!showPad"
           @touchstart="onLockStart" @touchend="onLockEnd"
           @mousedown="onLockStart" @mouseup="onLockEnd">
        <div class="lock-top">
          <span>{{ clock }}</span>
          <span class="lock-icons">
            <span class="signal"><i></i><i></i><i></i><i :class="{off:!wifiOn}"></i></span>
            <span class="battery" :class="{low:battery<=20}">{{ battery }}</span>
          </span>
        </div>
        <div class="lock-center">
          <div class="lock-time">{{ clock }}</div>
          <div class="lock-date">{{ lockDate }}</div>
        </div>
        <div class="lock-hint" @click="startUnlock">
          <div class="lock-arrow">︿</div>
          <div>{{ hasPass ? '上滑输入密码' : '上滑解锁' }}</div>
        </div>
      </div>
      <div class="lock-pad" v-else>
        <div class="pad-top">{{ clock }}</div>
        <div class="pad-title">输入密码</div>
        <div class="pad-dots" :class="{shake}">
          <span v-for="i in 6" :key="i" :class="{filled:pin.length>=i}"></span>
        </div>
        <div class="pad-keys">
          <button v-for="n in 9" :key="n" @click="press(n)">{{ n }}</button>
          <button class="ghost"></button>
          <button @click="press(0)">0</button>
          <button class="ghost" @click="delPin">⌫</button>
        </div>
        <div class="pad-cancel" @click="showPad=false">取消</div>
      </div>
    </div>
    </transition>

    <div class="status-bar">
      <span class="sb-left">
        <span class="sb-time">{{ clock }}</span>
        <svg viewBox="0 0 24 24">
          <path d="M11 5L6 9H3v6h3l5 4z" stroke="none"/>
          <path d="M16 9l5 6M21 9l-5 6" stroke="var(--text)" fill="none" stroke-width="2"/>
        </svg>
      </span>
      <span class="sb-right">
        <span class="signal"><i></i><i></i><i></i><i :class="{off:!wifiOn}"></i></span>
        <svg class="wifi" viewBox="0 0 24 24" v-if="wifiOn">
          <path d="M2.5 9a15 15 0 0 1 19 0"/>
          <path d="M5.5 12.5a10 10 0 0 1 13 0"/>
          <path d="M8.5 16a5 5 0 0 1 7 0"/>
          <circle cx="12" cy="19.2" r="1.1" fill="var(--text)" stroke="none"/>
        </svg>
        <svg class="wifi" viewBox="0 0 24 24" v-else>
          <path d="M3 3l18 18"/>
          <path d="M8.5 16a5 5 0 0 1 7 0"/>
          <circle cx="12" cy="19.2" r="1.1" fill="var(--text)" stroke="none"/>
        </svg>
        <span class="battery" :class="{low:battery<=20}">{{ battery }}</span>
      </span>
    </div>

    <div class="screen">
      <transition name="fade" mode="out-in">
        <div v-if="view==='desktop'" key="desktop" style="flex:1;display:flex;flex-direction:column;position:relative;min-height:0">
          <div class="desktop-wrap" ref="wrapRef" @scroll="onWrapScroll"
               @touchstart="onGridDown" @touchend="onGridUp" @touchmove="onGridMove"
               @mousedown="onGridDown" @mouseup="onGridUp" @mouseleave="onGridUp"
               @contextmenu.prevent="toggleEdit">
            <div class="page-slide" v-for="(pg,pi) in pages" :key="pi">
              <div class="grid" :class="{editing}" @click.self="editing=false">
                <template v-for="(item,ii) in pg" :key="item.id">
                  <div v-if="item.type==='postcard'" class="postcard"
                       :class="{dragging:dragPage===pi && dragIdx===ii}"
                       :data-drop-page="pi" :data-drop-index="ii"
                       @touchstart.stop="onItemTouchStart(pi,ii,$event)" @touchmove="onItemTouchMove" @touchend="onItemTouchEnd">
                    <div class="bg" :style="bgStyle(state.postcard.bg)" @click="!editing && pickImage('postcardBg')"></div>
                    <div class="fade"></div>
                    <div class="avatar" :style="bgStyle(state.postcard.avatar)" @click.stop="!editing && pickImage('avatar')"></div>
                    <input class="nick-input" v-model="state.postcard.nick" placeholder="点击输入昵称" @change="savePostcard" :disabled="editing">
                    <input class="sign-input" v-model="state.postcard.sign" placeholder="点击输入签名" @change="savePostcard" :disabled="editing">
                    <div class="del-badge" v-if="editing" @click.stop="removeItem(pi,ii)">×</div>
                  </div>

                  <div v-else-if="item.type==='listen'" class="listen"
                       :class="{dragging:dragPage===pi && dragIdx===ii}"
                       :data-drop-page="pi" :data-drop-index="ii"
                       @touchstart.stop="onItemTouchStart(pi,ii,$event)" @touchmove="onItemTouchMove" @touchend="onItemTouchEnd">
                    <div class="del-badge" v-if="editing" @click.stop="removeItem(pi,ii)">×</div>
                    <div class="head">
                      <span class="vip">VIP</span>
                      <input class="song" v-model="listen.song" @change="saveListen" placeholder="歌曲名" :disabled="editing">
                    </div>
                    <div class="sub">
                      <input class="artist" v-model="listen.artist" @change="saveListen" placeholder="歌手" :disabled="editing">
                      <button class="follow">关注</button>
                    </div>
                    <div class="avatars">
                      <div class="av left" :style="listenUrls.av1?{backgroundImage:'url('+listenUrls.av1+')'}:{}" @click="!editing && pickListen('av1')"></div>
                      <div class="av right" :style="listenUrls.av2?{backgroundImage:'url('+listenUrls.av2+')'}:{}" @click="!editing && pickListen('av2')"></div>
                      <svg class="arc" viewBox="0 0 190 96">
                        <defs>
                          <linearGradient id="fadeL" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0" stop-color="#fff" stop-opacity=".9"/>
                            <stop offset="1" stop-color="#fff" stop-opacity="0"/>
                          </linearGradient>
                          <linearGradient id="fadeR" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0" stop-color="#fff" stop-opacity=".9"/>
                            <stop offset="1" stop-color="#fff" stop-opacity="0"/>
                          </linearGradient>
                        </defs>
                        <path d="M28 46 C 18 88, 80 100, 92 100" stroke="url(#fadeL)"/>
                        <path d="M162 46 C 172 88, 110 100, 98 100" stroke="url(#fadeR)"/>
                      </svg>
                    </div>
                    <div class="caption">距离<b>520</b>km，一起听了<b>1314</b>分钟</div>
                  </div>

                  <div v-else class="app"
                       :class="{dragging:dragPage===pi && dragIdx===ii}"
                       :data-drop-page="pi" :data-drop-index="ii"
                       @click="!editing && openApp(getApp(item.appId))"
                       @touchstart.stop="onItemTouchStart(pi,ii,$event)" @touchmove="onItemTouchMove" @touchend="onItemTouchEnd">
                    <div class="app-icon"><svg viewBox="0 0 24 24" v-html="icons[getApp(item.appId).icon]"></svg></div>
                    <div class="app-name">{{ getApp(item.appId).name }}</div>
                    <div class="del-badge" v-if="editing" @click.stop="removeItem(pi,ii)">×</div>
                  </div>
                </template>
              </div>
            </div>
          </div>
          <div class="page-dots" v-if="!editing">
            <span v-for="(pg,i) in pages" :key="i" :class="{on:i===pageIndex}" @click="goPage(i)"></span>
          </div>
          <div class="edit-done" v-if="editing" @click="finishEdit">完成</div>
        </div>
        <div class="page" v-else key="app" :class="{'chat-app-hide-head':currentAppKey==='chat'}">
          <div class="page-head" v-if="!inChatRoom">
            <button class="icon-btn" @click="back"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
            <div class="title">{{ currentAppName }}</div>
          </div>
          <component :is="currentApp"/>
        </div>
      </transition>
    </div>

    <div v-if="ghost.show" class="ghost-card" :style="{left:ghost.x+'px',top:ghost.y+'px'}">
      <div v-if="ghost.item && ghost.item.type==='listen'" class="ghost-listen">
        <span class="gl-vip">VIP</span>
        <div class="gl-title">一起听</div>
        <div class="gl-avatars">
          <div class="gl-av" :style="listenUrls.av1?{backgroundImage:'url('+listenUrls.av1+')'}:{}"></div>
          <div class="gl-av" :style="listenUrls.av2?{backgroundImage:'url('+listenUrls.av2+')'}:{}"></div>
        </div>
      </div>
      <div v-else-if="ghost.item && ghost.item.type==='postcard'" class="ghost-postcard"
           :style="state.postcard.bg?{backgroundImage:'url('+(urlCache[state.postcard.bg]||'')+')'}:{}">
        <div class="gp-av" :style="state.postcard.avatar?{backgroundImage:'url('+(urlCache[state.postcard.avatar]||'')+')'}:{}"></div>
      </div>
      <span v-else-if="ghost.item" class="ghost-icon">
        <svg viewBox="0 0 24 24" width="34" height="34" v-html="icons[getApp(ghost.item.appId).icon]"></svg>
      </span>
    </div>

    <div class="dock" v-if="view==='desktop'">
      <div class="app" v-for="app in dockApps" :key="app.id" @click="openApp(app)" @contextmenu.prevent="toggleEdit">
        <div class="app-icon"><svg viewBox="0 0 24 24" v-html="icons[app.icon]"></svg></div>
      </div>
    </div>
  </div>
  `
}).mount('#app');
</script>
</body>
</html>
